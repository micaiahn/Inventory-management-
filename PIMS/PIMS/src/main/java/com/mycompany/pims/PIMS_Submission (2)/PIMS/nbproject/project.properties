annotation.processing.enabled=true
annotation.processing.enabled.in.editor=false
annotation.processing.processors.list=
annotation.processing.run.all.processors=true
annotation.processing.source.output=${build.generated.sources.dir}/ap-source-output
application.title=PIMS
application.vendor=YourName
build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form
build.dir=build
build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources
build.sysclasspath=ignore
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results
debug.classpath=\
    ${run.classpath}
debug.test.classpath=\
    ${run.test.classpath}
dist.dir=dist
dist.jar=${dist.dir}/PIMS.jar
dist.javadoc.dir=${dist.dir}/javadoc
excludes=
# --- MySQL Connector/J -------------------------------------------------
# 1. Download the "Platform Independent" .jar from
#    https://dev.mysql.com/downloads/connector/j/
# 2. Drop it into this project's /lib folder.
# 3. If the filename differs from the one below, rename the file to
#    match, OR update the line below to your exact filename (NetBeans
#    will offer to "Resolve Missing Server/Reference Problem" for you
#    automatically the first time you open this project if the name
#    doesn't match - just point it at your jar in /lib).
file.reference.mysql-connector-j.jar=lib/mysql-connector-j.jar
includes=**
jar.compress=false
javac.classpath=\
    ${file.reference.mysql-connector-j.jar}
javac.compilerargs=
javac.deprecation=false
javac.external.vm=true
javac.processorpath=\
    ${javac.classpath}
javac.source=17
javac.target=17
javac.test.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
javac.test.processorpath=\
    ${javac.test.classpath}
javadoc.additionalparam=
javadoc.author=false
javadoc.encoding=${source.encoding}
javadoc.html5=false
javadoc.noindex=false
javadoc.nonavbar=false
javadoc.notree=false
javadoc.private=false
javadoc.splitindex=true
javadoc.use=true
javadoc.version=false
javadoc.windowtitle=
main.class=com.pims.Main
manifest.file=manifest.mf
meta.inf.dir=${src.dir}/META-INF
mkdist.disabled=false
platform.active=default_platform
project.license=default
run.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
run.jvmargs=
run.test.classpath=\
    ${javac.test.classpath}:\
    ${build.test.classes.dir}
source.encoding=UTF-8
src.dir=src
test.src.dir=test
